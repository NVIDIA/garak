<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>garak Risk Coverage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one grid. The provider × risk heat map, a count column, and per-risk bars underneath. */
:root {
  --page: #f4f4ef;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7d7b75;
  --hair: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #4b7a00;          /* selection, the slice plane */
  --accent-soft: rgba(118,185,0,0.17);
  --cov-3: #1c5cab;           /* named */
  --cov-2: #3987e5;           /* partial */
  --cov-1: #86b6ef;           /* custom */
  --unk: #b9b7ae;
  --hatch: rgba(255,255,255,0.7);
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
  --face-a: #eceee6; --face-b: #e3e6dc; --face-c: #f3f4ee;
  --tip-bg: #121211; --tip-ink: #f0efec;
  --f-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --cell: 18px;
  --pitch: 2px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f0f0e; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #94928b;
    --hair: #2c2c2a; --axis: #45443f; --accent: #94d62a; --accent-soft: rgba(148,214,42,0.16);
    --cov-3: #86b6ef; --cov-2: #2a78d6; --cov-1: #184f95; --unk: #5d5c57; --hatch: rgba(0,0,0,0.5);
    --seq-1: #104281; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
    --face-a: #262724; --face-b: #2e302b; --face-c: #20211f; --tip-bg: #f0efec; --tip-ink: #121211;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f0f0e; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #94928b;
  --hair: #2c2c2a; --axis: #45443f; --accent: #94d62a; --accent-soft: rgba(148,214,42,0.16);
  --cov-3: #86b6ef; --cov-2: #2a78d6; --cov-1: #184f95; --unk: #5d5c57; --hatch: rgba(0,0,0,0.5);
  --seq-1: #104281; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
  --face-a: #262724; --face-b: #2e302b; --face-c: #20211f; --tip-bg: #f0efec; --tip-ink: #121211;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: grid; gap: 10px; margin-bottom: 18px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-cond); font-weight: 600; font-size: clamp(28px, 4vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.lede { max-width: 72ch; color: var(--ink-2); margin: 0; font-size: 15px; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin: 6px 0 18px; }
.howto div { min-width: 0; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--axis); padding-top: 8px; }
.howto b { display: block; color: var(--ink); font-family: var(--f-cond); font-weight: 600; font-size: 14px; letter-spacing: .01em; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; flex: none; }
.btn { font: 500 12.5px var(--f-sans); color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:focus-visible, .lab:focus-visible, .hdr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.slicechip { font-size: 12.5px; color: var(--ink-2); }
.slicechip b { color: var(--ink); }

.sheet { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; overflow-x: auto; }
.drawing { display: grid; position: relative; padding: 18px 18px 16px; width: max-content; }
.vt { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); align-self: end; padding-bottom: 6px; white-space: nowrap; }
.vt b { display: block; font-family: var(--f-cond); font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); font-weight: 600; }
.vt i { font-style: normal; color: var(--accent); }
.lab { font: 500 12.5px var(--f-cond); color: var(--ink); background: none; border: 0; padding: 0 8px 0 0; text-align: right; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: flex-end; gap: 6px; height: var(--cell); border-radius: 3px; }
.lab:hover { color: var(--accent); }
.lab .id, .hdr .id { font-family: var(--f-mono); font-size: 10px; color: var(--muted); font-weight: 400; }
.lab .nv { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.grp { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); align-self: end; padding: 0 8px 2px 0; text-align: right; white-space: nowrap; }
.l1 { font: 600 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--axis); align-self: end; padding-bottom: 3px; white-space: nowrap; overflow: hidden; }
.hdr { background: none; border: 0; padding: 0; cursor: pointer; display: flex; justify-content: center; align-items: flex-end; height: 100%; }
.hdr span.t { writing-mode: vertical-rl; transform: rotate(180deg); font: 500 12px var(--f-cond); color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 5px; padding-bottom: 4px; }
.hdr:hover span.t { color: var(--accent); }
.cell { width: var(--cell); height: var(--cell); border-radius: 3px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); position: relative; z-index: 1; font: 500 9.5px var(--f-mono); display: grid; place-items: center; color: transparent; }
.cell.lv3 { background: var(--cov-3); box-shadow: none; }
.sw.full { background: var(--cov-3); }
.cell.lv2, .sw.half { background: linear-gradient(to top right, var(--cov-3) calc(50% - .5px), transparent calc(50% + .5px)), var(--surface); box-shadow: inset 0 0 0 1px var(--cov-3); }
.cell.lvU { background-color: var(--surface); background-image: radial-gradient(var(--unk) 1.1px, transparent 1.3px); background-size: 4.5px 4.5px; box-shadow: inset 0 0 0 1px var(--hair); }
.cell.unconf::before { content: ""; position: absolute; inset: 0; border-radius: 3px; background: repeating-linear-gradient(45deg, var(--hatch) 0 1.6px, transparent 1.6px 4.6px); }
.cell.hint::before { content: ""; position: absolute; inset: 0; border-radius: 3px; background: repeating-linear-gradient(45deg, var(--cov-1) 0 1.6px, transparent 1.6px 4.6px); }
.cell.s1 { background: var(--seq-1); box-shadow: none; } .cell.s2 { background: var(--seq-2); box-shadow: none; }
.cell.s3 { background: var(--seq-3); box-shadow: none; } .cell.s4 { background: var(--seq-4); box-shadow: none; }
.cell.s5 { background: var(--seq-5); box-shadow: none; } .cell.s6 { background: var(--seq-6); box-shadow: none; }
.letters .cell::after { content: attr(data-t); position: relative; z-index: 2; color: var(--ink); }
.letters .cell.lv3::after, .letters .cell.s4::after, .letters .cell.s5::after, .letters .cell.s6::after { color: #fff; }
.letters .cell.lv2::after { color: var(--ink); text-shadow: 0 0 2px var(--surface), 0 0 2px var(--surface); }
:root[data-theme="dark"] .letters .cell.lv3::after { color: #0b0b0b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .letters .cell.lv3::after { color: #0b0b0b; } }
.band { background: var(--accent-soft); border-radius: 4px; z-index: 0; margin: -2px; box-shadow: inset 0 0 0 1.5px var(--accent); pointer-events: none; }
.lab.on, .hdr.on span.t { color: var(--accent); font-weight: 600; }
.cnt { font: 500 11.5px var(--f-mono); color: var(--ink-2); display: flex; align-items: center; padding-left: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bars { display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 2px; height: 100%; }
.bars i { display: block; width: var(--cell); border-radius: 0 0 2px 2px; }
.bars i.n { background: var(--cov-3); border-radius: 2px 2px 3px 3px; }
.bars i.p { background: color-mix(in srgb, var(--cov-3) 40%, transparent); border-radius: 3px 3px 2px 2px; }
.marg { font: 400 11px var(--f-sans); color: var(--muted); text-align: right; padding-right: 8px; align-self: center; line-height: 1.25; }
.axisnote { font: 400 11px var(--f-sans); color: var(--muted); }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; max-width: 340px; box-shadow: 0 6px 24px rgba(0,0,0,.18); line-height: 1.4; }
.tip .k { font-family: var(--f-mono); font-size: 10.5px; opacity: .7; text-transform: uppercase; letter-spacing: .05em; }
.tip .v { font-weight: 600; }
.tip .n { opacity: .85; margin-top: 4px; font-size: 12px; }

.below { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; margin-top: 22px; align-items: start; }
@media (max-width: 860px) { .below { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel h2 { font-family: var(--f-cond); font-weight: 600; font-size: 20px; margin: 0 0 2px; text-wrap: balance; }
.panel h3 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; font-weight: 500; }
.panel p { margin: 6px 0; color: var(--ink-2); max-width: 70ch; }
.panel .sub { color: var(--muted); font-size: 12.5px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; margin-top: 10px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 500 11.5px var(--f-sans); border: 1px solid var(--axis); border-radius: 999px; padding: 1px 8px; color: var(--ink-2); }
.list { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.list li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; font-size: 13px; align-items: start; }
.list li .sw { width: 12px; height: 12px; margin-top: 3px; }
.list li small { color: var(--muted); display: block; overflow-wrap: anywhere; }
.src a { color: var(--ink-2); overflow-wrap: anywhere; font-size: 12.5px; }
.method p { font-size: 13px; }
.method ul { margin: 6px 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; display: grid; gap: 4px; }
.findings { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.findings li { font-size: 13.5px; color: var(--ink-2); padding-left: 12px; border-left: 2px solid var(--axis); }
.findings li b { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .cell { transition: background-color .15s ease; } .band { transition: all .15s ease; } }

/* heat-map-only variant */
.sheet { width: max-content; max-width: 100%; }
.key { width: 0; min-width: 100%; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 8px 26px; padding: 18px 18px 6px; font-size: 12.5px; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 8px; }
.bars, .marg { display: none; }

/* garak-only variant */
.cell.off, .sw.off { background: repeating-linear-gradient(45deg, var(--cov-3) 0 1.6px, transparent 1.6px 4.6px), var(--surface); box-shadow: inset 0 0 0 1px var(--cov-3); }
.key { flex-direction: column; gap: 8px; }
.kg { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: start; gap: 4px 12px; }
.kg b { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 1px; }
.ki { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.sidenote { margin: 10px 2px 0; font-size: 12px; color: var(--muted); }
.key .hint { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); }
.lab.static { cursor: default; }
.lab.static:hover { color: var(--ink); }
.axisnote.fam { align-self: end; padding-bottom: 6px; white-space: nowrap; }
.tip .mono { font-family: var(--f-mono); font-size: 11px; }
.tip i { font-style: normal; opacity: .75; }
</style>

<div class="wrap">
  <div class="sheet" id="sheet">
    <div class="key" role="group" aria-label="What the tiles mean">
      <div class="kg"><b>Coverage row</b><div class="ki">
        <span><i class="sw full"></i>Covered: a probe measures the main harm</span>
        <span><i class="sw half"></i>Partly covered: probes cover part of it, or only check for a refusal</span>
      </div></div>
      <div class="kg"><b>Probe rows</b><div class="ki">
        <span><i class="sw full"></i>Tagged with this risk type</span>
      </div></div>
      <p class="hint">Hover over a tile, or tap it, to see the probes for that risk type.</p>
    </div>
    <div class="drawing" id="drawing" role="group" aria-label="garak probes by risk type"></div>
  </div>
  <p class="sidenote">Note: passing these probes doesn't mean a target is secure.</p>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const DATA = {"risks": [{"id": "C1", "cat": "C", "tag": "openerm:cybersecurity:malicious_code", "s": "Malicious code", "f": "Malicious code generation", "descr": "The target writes code with security weaknesses, unsafe defaults, or malicious or non-existent dependencies, or writes malware.", "status": "tested", "gap": "No insecure-code (CWE) probe. malwaregen's detector only checks that code was produced.", "title": "Malicious Code Generation"}, {"id": "C2", "cat": "C", "tag": "openerm:cybersecurity:malicious_tool_calls", "s": "Malicious tool calls", "f": "Malicious tool call generation", "descr": "An agent uses its tools outside their intended purpose, or a downstream system runs or renders the target's output as a command, query or markup without checking it.", "status": "partial", "gap": "Covers output that a downstream system renders or runs. Only AgentBreaker attacks agent tool use, and it judges success from the conversation, not the tool calls.", "title": "Malicious Tool Call Generation"}, {"id": "C3", "cat": "C", "tag": "openerm:cybersecurity:policy_extraction", "s": "Policy extraction", "f": "Model safety policy extraction", "descr": "The target reveals its system prompt, policy rules or other configuration that its safety controls rely on.", "status": "tested", "gap": "", "title": "Model Safety Policy Extraction"}, {"id": "C4", "cat": "C", "tag": "openerm:cybersecurity:excessive_tokens", "s": "Excess tokens", "f": "Excessive token generation", "descr": "Inputs or agent behaviour that use up compute, tokens or quota and degrade the service for other users.", "status": "partial", "gap": "Nothing on cost, latency, quota or runaway loops.", "title": "Excessive Token Generation"}, {"id": "C5", "cat": "C", "tag": "openerm:cybersecurity:misaligned_generation", "s": "Misaligned with goal", "f": "Misaligned generation against system goal", "descr": "The operator loses the ability to observe, correct or stop the system as it pursues goals that drift from what was intended.", "status": "none", "gap": "", "title": "Misaligned Generation against System Goal"}, {"id": "D1", "cat": "D", "tag": "openerm:data_protection:training_data_disclosure", "s": "Training data leak", "f": "Unauthorized disclosure of training data", "descr": "Personal or confidential data learned in training is recovered through queries.", "status": "tested", "gap": "divergence.Repeat flags the target drifting away from the repeated word, not the leaked data itself. propile checks for real people's personal data.", "title": "Unauthorized Disclosure of Training Data"}, {"id": "D2", "cat": "D", "tag": "openerm:data_protection:inferred_sensitive_data", "s": "Inferred sensitive data", "f": "Inferred sensitive data / de-anonymization", "descr": "The target links anonymous data back to a person, or infers attributes they did not disclose.", "status": "none", "gap": "", "title": "Inferred Sensitive Data / Data De-Anonymization"}, {"id": "D3", "cat": "D", "tag": "openerm:data_protection:pii_disclosure", "s": "PII disclosure", "f": "PII disclosure", "descr": "Personal data that reached the system at run time, through the prompt, retrieved documents, tools or memory, goes to someone not entitled to it.", "status": "partial", "gap": "Checks whether conversation data leaves through a link the client would render. Not specific to personal data.", "title": "PII Disclosure"}, {"id": "D4", "cat": "D", "tag": "openerm:data_protection:model_theft", "s": "Model theft", "f": "Model theft", "descr": "An attacker copies the model's weights or reconstructs its behaviour through systematic queries.", "status": "none", "gap": "", "title": "Model Theft"}, {"id": "D5", "cat": "D", "tag": "openerm:data_protection:model_distillation", "s": "Distillation", "f": "Model distillation", "descr": "Outputs are harvested at scale to train another model, usually against the terms they were served under.", "status": "none", "gap": "", "title": "Model Distillation"}, {"id": "D6", "cat": "D", "tag": "o const GROUPS = [{id:'C',name:'Cybersecurity'},{id:'D',name:'Data protection'},{id:'T',name:'Content'},{id:'H',name:'Human–AI'},{id:'B',name:'Bias'}];
const RISKS = DATA.risks;
const LV = {tested: 3, partial: 2, none: 0};
const LVNAME = {3: 'Covered', 2: 'Partly covered', 0: 'Not covered'};
const ORDER = RISKS.map(r => r.id);

/* probe families: one row per garak probe module */
const famMap = {};
Object.entries(DATA.probes).forEach(([name, maps]) => {
  const [m, cls] = name.split('.');
  (famMap[m] = famMap[m] || {id: m, classes: []}).classes.push({cls, on: !!DATA.active[name], risks: maps.map(x => x.risk), why: Object.fromEntries(maps.map(x => [x.risk, x.why]))});
});
const FAMS = Object.values(famMap)
  .map(f => ({...f, first: Math.min(...f.classes.flatMap(c => c.risks.map(r => ORDER.indexOf(r))))}))
  .sort((a, b) => a.first - b.first || a.id.localeCompare(b.id));

const $ = s => document.querySelector(s);
const drawing = $('#drawing');
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

/* ---------- grid geometry ---------- */
const COL = {};
let c = 2;
GROUPS.forEach((g, gi) => {
  if (gi) c++;
  RISKS.filter(r => r.cat === g.id).forEach(r => { COL[r.id] = c++; });
});
const GUT = c++, CNT = c++;
const colTemplate = ['168px'];
for (let i = 2; i < c; i++) {
  if (i === GUT) colTemplate.push('26px');
  else if (i === CNT) colTemplate.push('74px');
  else if (Object.values(COL).includes(i)) colTemplate.push('var(--cell)');
  else colTemplate.push('8px');
}
drawing.style.gridTemplateColumns = colTemplate.join(' ');
drawing.style.columnGap = 'var(--pitch)';
drawing.style.rowGap = 'var(--pitch)';

let r = 1;
const L1ROW = r++, HDRROW = r++, SUMROW = r++, FAMHDR = r++;
const FROW = {};
FAMS.forEach(f => { FROW[f.id] = r++; });
const LAST = r - 1;
const rowTemplate = [];
for (let i = 1; i < r; i++) rowTemplate.push(i === L1ROW ? '22px' : i === HDRROW ? '150px' : i === FAMHDR ? '30px' : 'var(--cell)');
drawing.style.gridTemplateRows = rowTemplate.join(' ');

function el(tag, cls, row, col, rowSpan, colSpan, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  e.style.gridRow = rowSpan ? `${row} / span ${rowSpan}` : row;
  e.style.gridColumn = colSpan ? `${col} / span ${colSpan}` : col;
  if (html != null) e.innerHTML = html;
  drawing.appendChild(e);
  return e;
}

/* ---------- frame ---------- */
el('div', 'vt', HDRROW, 1, null, null, 'garak <b>Probe × risk type</b>');
GROUPS.forEach(g => {
  const cols = RISKS.filter(x => x.cat === g.id).map(x => COL[x.id]);
  el('div', 'l1', L1ROW, cols[0], 1, cols[cols.length - 1] - cols[0] + 1, esc(g.name));
});
RISKS.forEach(x => {
  const b = el('button', 'hdr', HDRROW, COL[x.id], null, null, `<span class="t">${esc(x.s)} <span class="id">${x.id}</span></span>`);
  b.type = 'button'; b.dataset.axis = 'r'; b.dataset.key = x.id; b.title = `${x.id} ${x.title}\n${x.tag}`;
});
el('div', 'vt', HDRROW, CNT, null, null, '<span style="white-space:normal;display:block;padding-left:10px;line-height:1.3">tagged<br>probes</span>');

const sumLab = el('div', 'lab static', SUMROW, 1, null, null, '<i class="nv" title="NVIDIA"></i><span>garak coverage</span>');
const tested = RISKS.filter(x => x.status === 'tested').length, partial = RISKS.filter(x => x.status === 'partial').length;
el('div', 'cnt', SUMROW, CNT, null, null, `${Object.keys(DATA.probes).length}`);
el('div', 'grp', FAMHDR, 1, null, null, 'Probe families');
el('div', 'axisnote fam', FAMHDR, COL.C1, null, CNT - COL.C1 + 1, `${tested} risk types covered, ${partial} partly covered, ${RISKS.length - tested - partial} not covered`);

const cells = {};
RISKS.forEach(x => {
  const lv = LV[x.status];
  const e = el('div', 'cell' + (lv === 3 ? ' lv3' : lv === 2 ? ' lv2' : ''), SUMROW, COL[x.id]);
  e._d = {kind: 'sum', r: x.id};
});
FAMS.forEach(f => {
  const b = el('button', 'lab', FROW[f.id], 1, null, null, `<span>${esc(f.id)}</span>`);
  b.type = 'button'; b.dataset.axis = 'f'; b.dataset.key = f.id;
  b.title = f.classes.map(k => `${f.id}.${k.cls}: ${k.risks.join(', ')}`).join('\n');
  RISKS.forEach(x => {
    const hits = f.classes.filter(k => k.risks.includes(x.id));
    const cls = hits.length ? ' lv3' : '';
    const e = el('div', 'cell' + cls, FROW[f.id], COL[x.id]);
    if (hits.length) e._d = {kind: 'fam', f: f.id, r: x.id, hits};
  });
  el('div', 'cnt', FROW[f.id], CNT, null, null, `${f.classes.length}`);
});

/* ---------- selection band ---------- */
let slice = null;
function render() {
  drawing.querySelectorAll('.band').forEach(b => b.remove());
  drawing.querySelectorAll('.on').forEach(b => b.classList.remove('on'));
  if (!slice) return;
  drawing.querySelectorAll(`[data-axis="${slice.axis}"][data-key="${slice.key}"]`).forEach(b => b.classList.add('on'));
  const b = slice.axis === 'f'
    ? el('div', 'band', FROW[slice.key], COL.C1, null, CNT - COL.C1 + 1)
    : el('div', 'band', HDRROW, COL[slice.key], LAST - HDRROW + 1);
  drawing.insertBefore(b, drawing.firstChild);
}
drawing.addEventListener('click', e => {
  const cl = e.target.closest('.cell');
  if (cl && cl._d) { showTip(cl._d, e.clientX, e.clientY); return; }
  const b = e.target.closest('[data-axis]');
  if (!b) return;
  slice = slice && slice.axis === b.dataset.axis && slice.key === b.dataset.key ? null : {axis: b.dataset.axis, key: b.dataset.key};
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && slice) { slice = null; render(); } });

/* ---------- tooltip ---------- */
const tip = $('#tip');
const rById = id => RISKS.find(x => x.id === id);
function tipHTML(d) {
  const R = rById(d.r);
  if (d.kind === 'sum') return `<div class="k">garak · ${R.id}</div><div>${esc(R.title)}</div><div class="v">${LVNAME[LV[R.status]]}</div>${R.gap ? `<div class="n">${esc(R.gap)}</div>` : ''}<div class="n mono">${esc(R.tag)}</div>`;
  const list = d.hits.map(k => esc(k.cls)).join(', ');
  const why = [...new Set(d.hits.map(k => k.why[d.r]))].join('; ');
  return `<div class="k">${esc(d.f)} · ${R.id}</div><div>${esc(R.title)}</div><div class="v">${d.hits.length} probe${d.hits.length > 1 ? 's' : ''}: ${list}</div><div class="n">${esc(why)}</div>`;
}
function showTip(d, cx, cy) {
  tip.innerHTML = tipHTML(d); tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = cx + 14, y = cy + 14;
  if (x + w > innerWidth - 8) x = cx - w - 14;
  if (y + h > innerHeight - 8) y = cy - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
drawing.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const cl = e.target.closest('.cell');
  if (!cl || !cl._d) { tip.hidden = true; return; }
  showTip(cl._d, e.clientX, e.clientY);
});
drawing.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') tip.hidden = true; });
document.addEventListener('click', e => { if (!e.target.closest('.cell')) tip.hidden = true; });
</script>
